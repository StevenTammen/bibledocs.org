## Focusing on the spiritual: general background, and practical considerations

Initial question:

> Practical things people do to deal with distractions in this world, as we do live in this world. How do we stay focused on our time with the Lord in this world of so much noise? Is there any way we can focus our attention on the spiritual in a more quick and effective way?



---




### As Christians, we ought not separate ourselves completely from the world



<div class="special-content scripture">
<strong>1 Corinthians 5:9-11 | NIV11</strong>

<p><strong>9</strong> I wrote to you in my letter not to associate with sexually immoral people— <strong>10</strong> not at all meaning the people of this world who are immoral, or the greedy and swindlers, or idolaters. In that case you would have to leave this world. <strong>11</strong> But now I am writing to you that you must not associate with anyone who claims to be a brother or sister but is sexually immoral or greedy, an idolater or slanderer, a drunkard or swindler. Do not even eat with such people.</p>

</div>


<div class="special-content scripture">
<strong>Matthew 5:14-16 | NIV11</strong>

<p><strong>14</strong> “You are the light of the world. A town built on a hill cannot be hidden. <strong>15</strong> Neither do people light a lamp and put it under a bowl. Instead they put it on its stand, and it gives light to everyone in the house. <strong>16</strong> In the same way, let your light shine before others, that they may see your good deeds and glorify your Father in heaven. </p>

</div>




---




### There is enmity between the world and us as believers



<div class="special-content scripture">
<strong>James 4:4 | NIV11</strong>

<p><strong>4</strong> You adulterous people, don’t you know that friendship with the world means enmity against God? Therefore, anyone who chooses to be a friend of the world becomes an enemy of God.</p>

</div>


<div class="special-content scripture">
<strong>John 15:18-25 | NIV11</strong>

<p><strong>18</strong> “If the world hates you, keep in mind that it hated me first. <strong>19</strong> If you belonged to the world, it would love you as its own. As it is, you do not belong to the world, but I have chosen you out of the world. That is why the world hates you. <strong>20</strong> Remember what I told you: ‘A servant is not greater than his master.’ If they persecuted me, they will persecute you also. If they obeyed my teaching, they will obey yours also. <strong>21</strong> They will treat you this way because of my name, for they do not know the one who sent me. <strong>22</strong> If I had not come and spoken to them, they would not be guilty of sin; but now they have no excuse for their sin. <strong>23</strong> Whoever hates me hates my Father as well. <strong>24</strong> If I had not done among them the works no one else did, they would not be guilty of sin. As it is, they have seen, and yet they have hated both me and my Father. <strong>25</strong> But this is to fulfill what is written in their Law: ‘They hated me without reason.’</p>

</div>


<div class="special-content scripture">
<strong>1 John 2:15 | NIV11</strong>

<p><strong>15</strong> Do not love the world or anything in the world. If anyone loves the world, love for the Father is not in them.</p>

</div>


<div class="special-content scripture">
<strong>Romans 12:2 | NIV11</strong>

<p><strong>2</strong> Do not conform to the pattern of this world, but be transformed by the renewing of your mind. Then you will be able to test and approve what God’s will is—his good, pleasing and perfect will.</p>

</div>


<div class="special-content scripture">
<strong>1 John 5:19 | NIV11</strong>

<p><strong>19</strong> We know that we are children of God, and that the whole world is under the control of the evil one.</p>

</div>


<hr/>

Metaphor: We are servants or ambassadors of Christ. Their are behavioral expectations that go along with this role.

- If a human king sent us to the court of an enemy, he would not expect us to betray him, but to be a witness in the court of this enemy. How much more so God.

<hr/>

Classes of distractions:

- Everyday distractions. Work, family, etc.
- Then there are wider things: the shot and shell of life. Political change. Economic philosophy. And so on.

There are lots of types of distractions.

So how to manage all these distractions?

- Something has to be relevant for our spiritual pursuits for it to be a worthy thing to spend time on.
- How do you draw lines between any action you take, and your spiritual growth? We should think in such terms.
  - It can get a bit complicated. Watching a movie may help you relax, and relaxing may help you regain energy to pursue spiritual matters. But the underlying calculus is actually still there.

So when we think of distractions, what makes one thing a distraction, and another thing not? It is their relevance to the spiritual.

<hr/>

> Q: What about distractions that are more internal (like over-focusing on our problems, or worry, fear, etc)? Is this the same thing as external distractions since Satan's word system is designed to play on our sin natures, or is there separate tactics we should use to combat these types of distractions?

Definitely, Satan's World System does try to prey upon our sin natures.

Also, oftentimes the triggers for internal struggles comes from external factors or external stimuli.

This actually means that some degree of internal struggles can be helped by trying to avoid external triggers. Maybe not 100%, but definitely some degree. 




---




### So we shouldn't focus on the world, but on the eternal and the spiritual



<div class="special-content scripture">
<strong>Colossians 3:2 | NIV11</strong>

<p><strong>2</strong> Set your minds on things above, not on earthly things.</p>

</div>


<div class="special-content scripture">
<strong>Matthew 6:20-21 | NIV11</strong>

<p><strong>20</strong> But store up for yourselves treasures in heaven, where moths and vermin do not destroy, and where thieves do not break in and steal. <strong>21</strong> For where your treasure is, there your heart will be also.</p>

</div>


<div class="special-content scripture">
<strong>Philippians 3:20 | NIV11</strong>

<p><strong>20</strong> But our citizenship is in heaven. And we eagerly await a Savior from there, the Lord Jesus Christ,</p>

</div>


<div class="special-content scripture">
<strong>Hebrews 11:13-16 | NIV11</strong>

<p><strong>13</strong> All these people were still living by faith when they died. They did not receive the things promised; they only saw them and welcomed them from a distance, admitting that they were foreigners and strangers on earth. <strong>14</strong> People who say such things show that they are looking for a country of their own. <strong>15</strong> If they had been thinking of the country they had left, they would have had opportunity to return. <strong>16</strong> Instead, they were longing for a better country—a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.</p>

</div>


<div class="special-content scripture">
<strong>2 Corinthians 4:17 | NIV11</strong>

<p><strong>17</strong> For our light and momentary troubles are achieving for us an eternal glory that far outweighs them all.</p>

</div>


<hr/>

Doesn't matter what shape the world takes or what our circumstances might be, but only what we are fighting for and our attitude about that fight.

Cf. military analogy. Soldiers cannot hesitate; they *have* to know their objective. So when we face worry and anxiety, we need to think in terms of removing obstacles that get in the way of our objective. We must be resolved to chase after our mission.

- Not that this is easy in the slightest. But the point is that the attitude we need to have as Christians is similar to the attitude soldiers have in carrying out their missions on the battlefield.
- Resources are available to us on the battlefield, and so are the opportunities for us to achieve victory

<hr/>

The battlefield for us is our minds; the spiritual battlefield is where we put our thoughts and our focus. So it's not a physical fight *per se*.

How we fight this fight is based on what ideas we have, and our mindset/attitude towards them. This is true even in other matters in the world, but even more so for us, dealing with eternal, spiritual matters.

### Focusing on the spiritual: practical considerations

Basically, what are some practical steps we can take to sharpen our focus on the spiritual, and continually keep our eyes fixed where we ought?

<div class="special-content scripture">

<p><strong>1</strong> Then Jesus told his disciples a parable to show them that they should always pray and not give up.</p>

or stand in the way that sinners take<br />

#### Building up spiritual momentum, habits, and routine



Link to a past study where we discussed spiritual momentum:

- [Gaining spiritual momentum is not so easy, but is important. Consistency is essential](https://www.youtube.com/watch?v=imT6LbKPdY4)

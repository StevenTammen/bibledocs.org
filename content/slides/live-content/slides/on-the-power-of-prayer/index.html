## On the power of prayer





---


### Summary


---





### What does "the prayer of a righteous man avails much" mean?

Our starting verse is this one:

<div class="special-content scripture">
<strong>James 5:16 | NIV11</strong>

<p>Therefore confess your sins to each other and pray for each other so that you may be healed. The prayer of a righteous person is powerful and effective.</p>

</div>




---




### What does "the prayer of a righteous man avails much" mean?

And we might also compare:

<div class="special-content scripture">
<strong>1 Peter 3:12 | NIV11</strong>

<p>For the eyes of the Lord are on the righteous<br />
&emsp;and his ears are attentive to their prayer,<br />
but the face of the Lord is against those who do evil.</p>

</div>


<div class="special-content scripture">
<strong>Proverbs 15:29 | NIV11</strong>
<p>The Lord is far from the wicked,<br />
&emsp;but he hears the prayer of the righteous.</p>
</div>


<div class="special-content scripture">
<strong>Proverbs 15:8 | NIV11</strong>
<p>The Lord detests the sacrifice of the wicked,<br />
&emsp;but the prayer of the upright pleases him.</p>
</div>




---




### As we grow closer to the Lord, does the power of our prayers somehow change?



---




### Are there any specific steps we can take to make sure our prayers are "more heard"?

For example, if we have something we care very deeply about---like the salvation and well-being of our children---can we "turn up the power" somehow, for these areas of special care?

Persistence in prayer is clearly taught in the parable of the persistent widow:

<div class="special-content scripture">
<strong>Luke 18:1-8 | NIV11</strong>

<p><strong>1</strong> Then Jesus told his disciples a parable to show them that they should always pray and not give up. <strong>2</strong> He said: “In a certain town there was a judge who neither feared God nor cared what people thought. <strong>3</strong> And there was a widow in that town who kept coming to him with the plea, ‘Grant me justice against my adversary.’</p>

<p><strong>4</strong> “For some time he refused. But finally he said to himself, ‘Even though I don’t fear God or care what people think, <strong>5</strong> yet because this widow keeps bothering me, I will see that she gets justice, so that she won’t eventually come and attack me!’”</p>

<p><strong>6</strong> And the Lord said, “Listen to what the unjust judge says. <strong>7</strong> And will not God bring about justice for his chosen ones, who cry out to him day and night? Will he keep putting them off? <strong>8</strong> I tell you, he will see that they get justice, and quickly. However, when the Son of Man comes, will he find faith on the earth?”</p>

</div>




---




### Are there any specific steps we can take to make sure our prayers are "more heard"?

And we might also compare Jacob wrestling the angel of the Lord:

<div class="special-content scripture">
<strong>Genesis 32:24-29 | NIV11</strong>

<p><strong>24</strong> So Jacob was left alone, and a man wrestled with him till daybreak. <strong>25</strong> When the man saw that he could not overpower him, he touched the socket of Jacob’s hip so that his hip was wrenched as he wrestled with the man. <strong>26</strong> Then the man said, “Let me go, for it is daybreak.”</p>

<p>But Jacob replied, “I will not let you go unless you bless me.”</p>

<p><strong>27</strong> The man asked him, “What is your name?”</p>

<p>“Jacob,” he answered.</p>

<p><strong>28</strong> Then the man said, “Your name will no longer be Jacob, but Israel,[f] because you have struggled with God and with humans and have overcome.”</p>

<p><strong>29</strong> Jacob said, “Please tell me your name.”</p>

<p>But he replied, “Why do you ask my name?” Then he blessed him there.</p>

</div>




---




### Are there any specific steps we can take to make sure our prayers are "more heard"?

We also see boldness in prayer taught in Luke 11:

<div class="special-content scripture">
<strong>Luke 11:5-8 | NIV11</strong>

<p><strong>5</strong> Then Jesus said to them, “Suppose you have a friend, and you go to him at midnight and say, ‘Friend, lend me three loaves of bread; <strong>6</strong> a friend of mine on a journey has come to me, and I have no food to offer him.’ <strong>7</strong> And suppose the one inside answers, ‘Don’t bother me. The door is already locked, and my children and I are in bed. I can’t get up and give you anything.’ <strong>8</strong> I tell you, even though he will not get up and give you the bread because of friendship, yet because of your shameless audacity he will surely get up and give you as much as you need.</p>

</div>

### What kind of prayers should we pray for our children, given that God does not override free will?

Even if we want what is unquestionably best for our children, we ought not necessarily get mad at God if He doesn't override our children's free will (since He will never force things). So how ought we pray for them then?

Consider Job praying on behalf of his children:

<div class="special-content scripture">
<strong>Job 1:5 | NIV11</strong>

<p>When a period of feasting had run its course, Job would make arrangements for them to be purified. Early in the morning he would sacrifice a burnt offering for each of them, thinking, “Perhaps my children have sinned and cursed God in their hearts.” This was Job’s regular custom.</p>

</div>


You can see his care for his children in his actions. Even if his children were not repentant, Job did everything so far it depended on him to ensure their well-being.



---




### What kind of prayers should we pray for our children, given that God does not override free will?

We can see that God answers the requests and prayers (spoken and unspoken) of those who call out on behalf of their children:

<div class="special-content scripture">
<strong>Genesis 21:14-19 | NIV11</strong>

<p><strong>14</strong> Early the next morning Abraham took some food and a skin of water and gave them to Hagar. He set them on her shoulders and then sent her off with the boy. She went on her way and wandered in the Desert of Beersheba.</p>

<p><strong>15</strong> When the water in the skin was gone, she put the boy under one of the bushes. <strong>16</strong> Then she went off and sat down about a bowshot away, for she thought, “I cannot watch the boy die.” And as she sat there, she began to sob.</p>

<p><strong>17</strong> God heard the boy crying, and the angel of God called to Hagar from heaven and said to her, “What is the matter, Hagar? Do not be afraid; God has heard the boy crying as he lies there. <strong>18</strong> Lift the boy up and take him by the hand, for I will make him into a great nation.”</p>

<p><strong>19</strong> Then God opened her eyes and she saw a well of water. So she went and filled the skin with water and gave the boy a drink.</p>

</div>




---






<div class="special-content scripture">
<strong>2 Kings 4:18-37 | NIV11</strong>

<p><strong>18</strong> When the child had grown, he went out one day to his father among the reapers. <strong>19</strong> And he said to his father, “Oh, my head, my head!” The father said to his servant, “Carry him to his mother.” <strong>20</strong> And when he had lifted him and brought him to his mother, the child sat on her lap till noon, and then he died. <strong>21</strong> And she went up and laid him on the bed of the man of God and shut the door behind him and went out. <strong>22</strong> Then she called to her husband and said, “Send me one of the servants and one of the donkeys, that I may quickly go to the man of God and come back again.” <strong>23</strong> And he said, “Why will you go to him today? It is neither new moon nor Sabbath.” She said, “All is well.” <strong>24</strong> Then she saddled the donkey, and she said to her servant, “Urge the animal on; do not slacken the pace for me unless I tell you.” <strong>25</strong> So she set out and came to the man of God at Mount Carmel.</p>



</div>
---
<div class="special-content scripture">






<p>When the man of God saw her coming, he said to Gehazi his servant, “Look, there is the Shunammite. <strong>26</strong> Run at once to meet her and say to her, ‘Is all well with you? Is all well with your husband? Is all well with the child?’” And she answered, “All is well.” <strong>27</strong> And when she came to the mountain to the man of God, she caught hold of his feet. And Gehazi came to push her away. But the man of God said, “Leave her alone, for she is in bitter distress, and the Lord has hidden it from me and has not told me.” <strong>28</strong> Then she said, “Did I ask my lord for a son? Did I not say, ‘Do not deceive me?’” <strong>29</strong> He said to Gehazi, “Tie up your garment and take my staff in your hand and go. If you meet anyone, do not greet him, and if anyone greets you, do not reply. And lay my staff on the face of the child.” <strong>30</strong> Then the mother of the child said, “As the Lord lives and as you yourself live, I will not leave you.” So he arose and followed her. <strong>31</strong> Gehazi went on ahead and laid the staff on the face of the child, but there was no sound or sign of life. Therefore he returned to meet him and told him, “The child has not awakened.”</p>



</div>

<div class="special-content scripture">






<p><strong>32</strong> When Elisha came into the house, he saw the child lying dead on his bed. <strong>33</strong> So he went in and shut the door behind the two of them and prayed to the Lord. <strong>34</strong> Then he went up and lay on the child, putting his mouth on his mouth, his eyes on his eyes, and his hands on his hands. And as he stretched himself upon him, the flesh of the child became warm. <strong>35</strong> Then he got up again and walked once back and forth in the house, and went up and stretched himself upon him. The child sneezed seven times, and the child opened his eyes. <strong>36</strong> Then he summoned Gehazi and said, “Call this Shunammite.” So he called her. And when she came to him, he said, “Pick up your son.” <strong>37</strong> She came and fell at his feet, bowing to the ground. Then she picked up her son and went out.</p>

</div>




---






<div class="special-content scripture">
<strong>Mark 5:21-43 | NIV11</strong>

<p><strong>21</strong> When Jesus had again crossed over by boat to the other side of the lake, a large crowd gathered around him while he was by the lake. <strong>22</strong> Then one of the synagogue leaders, named Jairus, came, and when he saw Jesus, he fell at his feet. <strong>23</strong> He pleaded earnestly with him, “My little daughter is dying. Please come and put your hands on her so that she will be healed and live.” <strong>24</strong> So Jesus went with him.</p>

<p>[...]</p>

<p><strong>35</strong> While Jesus was still speaking, some people came from the house of Jairus, the synagogue leader. “Your daughter is dead,” they said. “Why bother the teacher anymore?”</p>

<p><strong>36</strong> Overhearing what they said, Jesus told him, “Don’t be afraid; just believe.”</p>

<p><strong>37</strong> He did not let anyone follow him except Peter, James and John the brother of James. <strong>38</strong> When they came to the home of the synagogue leader, Jesus saw a commotion, with people crying and wailing loudly. <strong>39</strong> He went in and said to them, “Why all this commotion and wailing? The child is not dead but asleep.” <strong>40</strong> But they laughed at him.</p>

<p>After he put them all out, he took the child’s father and mother and the disciples who were with him, and went in where the child was. <strong>41</strong> He took her by the hand and said to her, “<em>Talitha koum</em>!” (which means “Little girl, I say to you, get up!”). <strong>42</strong> Immediately the girl stood up and began to walk around (she was twelve years old). At this they were completely astonished. <strong>43</strong> He gave strict orders not to let anyone know about this, and told them to give her something to eat.</p>

</div>




---






<div class="special-content scripture">
<strong>John 4:46-54 | NIV11</strong>

<p><strong>46</strong> Once more he visited Cana in Galilee, where he had turned the water into wine. And there was a certain royal official whose son lay sick at Capernaum. <strong>47</strong> When this man heard that Jesus had arrived in Galilee from Judea, he went to him and begged him to come and heal his son, who was close to death.</p>

<p><strong>48</strong> “Unless you people see signs and wonders,” Jesus told him, “you will never believe.”</p>

<p><strong>49</strong> The royal official said, “Sir, come down before my child dies.”</p>

<p><strong>50</strong> “Go,” Jesus replied, “your son will live.”</p>

<p>The man took Jesus at his word and departed. <strong>51</strong> While he was still on the way, his servants met him with the news that his boy was living. <strong>52</strong> When he inquired as to the time when his son got better, they said to him, “Yesterday, at one in the afternoon, the fever left him.”</p>

<p><strong>53</strong> Then the father realized that this was the exact time at which Jesus had said to him, “Your son will live.” So he and his whole household believed.</p>

<p><strong>54</strong> This was the second sign Jesus performed after coming from Judea to Galilee.</p>

</div>




---




### What kind of prayers should we pray for our children, given that God does not override free will?

So we should take heart and make sure we always pray for our children, for God will answer us.

We also know that not all families in the Bible were always perfect. Consider David's household: Amnon raping Tamar, Absalom murdering Amnon, Absalom's rebellion. Yet we see David mourn Absalom deeply in 2 Samuel 18:

<div class="special-content scripture">
<strong>2 Samuel 18:33 | NIV11</strong>

<p>The king was shaken. He went up to the room over the gateway and wept. As he went, he said: “O my son Absalom! My son, my son Absalom! If only I had died instead of you—O Absalom, my son, my son!”</p>

</div>




---




### What kind of prayers should we pray for our children, given that God does not override free will?

Also consider the resentment between Joseph and his brothers, which arose (at least in part) due to Jacob's favoritism:

<div class="special-content scripture">
<strong>Genesis 37:9-11 | NIV11</strong>

<p><strong>9</strong> Then he had another dream, and he told it to his brothers. “Listen,” he said, “I had another dream, and this time the sun and moon and eleven stars were bowing down to me.”</p>

<p><strong>10</strong> When he told his father as well as his brothers, his father rebuked him and said, “What is this dream you had? Will your mother and I and your brothers actually come and bow down to the ground before you?” <strong>11</strong> His brothers were jealous of him, but his father kept the matter in mind.</p>

</div>

## Why salvation is about faith, not knowledge

#### Ichthys: Initial explanation of why salvation is about faith, not knowledge

#### Ichthys: Initial explanation of why salvation is about faith, not knowledge

##### Source clip from Ichthys

##### Summary points





---






<div class="special-content quote">
<strong>
<a href="/site/content-features/#quotes">Quote</a> from <a href="https://www.ichthys.com/mail-sin-guilt-salvation6.htm"><i>Sin, Guilt, and Salvation VI</i></a> by <a href="https://ichthys.com/">Ichthys</a>
</strong>

<p><strong>Response #1</strong>: </p>

<p>Good to hear from you, my friend. Although I'm sorry to hear that you are still troubled and wrestling: Jacob wrestled too and was lamed for it – then he kept wrestling and was blessed for it. Like him, we should resist wrestling against the truth (as he first did) then hold on tight to the Lord ever after (as he did; <a href="https://ichthys.com/mail-Jacob-Wrestling.htm#Jacob%20wrestling%20with%20the%20angel%20meaning%20and%20significance">see the link</a>).</p>

<p>In a nutshell, salvation is not about knowledge – it is about faith. Salvation is all about trusting God, believing in Him and His truth. How much truth do we need to be saved in the first place? Only as much as a mustard seed's worth (Matt.13:31-32; 17:20). What if we didn't understand everything about salvation when we were saved? We were saved anyway. And no one understands everything about salvation when they are saved. That is impossible. In the Basics series, <a href="https://www.ichthys.com/4A-Christo.htm">BB 4A: Christology</a> is 220 pages single-spaced; <a href="https://www.ichthys.com/4B-Soterio.htm">BB 4B: Soteriology</a> is 143 pages single-spaced. They both contain many verse citations as well. And it's not as if the rest of the Basics Series is not in many ways applicable to salvation-knowledge (the Trinity is discussed in <a href="https://www.ichthys.com/1Theo.htm">BB 1</a>, for example, the baptism of the Spirit in <a href="https://www.ichthys.com/5-Pneumato.htm">BB 5</a>). I certainly didn't know or understand most of the information in these studies when I was saved at circa five years old. But I <strong><em>DO</em></strong> remember trusting God to deliver me from death.</p>



</div>
---
<div class="special-content quote">






<p>If a person affirmatively denies certain basic truths such as the deity of Christ, that is an obstacle to salvation (we see that plainly enough in the Bible; e.g., Jn.1:11). But if a person doesn't yet know or understand everything, that is not an obstacle to salvation. Salvation is about faith, not knowledge. The Holy Spirit, we must remember, is the Evangelist in chief. He is the One who makes the truth real to unbelievers who hear the gospel. He is God and can easily discern genuine faith from mere academic interest. He is clearly able to provide whatever is necessary to be saved to anyone who wants to be saved, anyone who is willing to believe – and it's all about that faith. Faith is often called in this ministry "free-will faith", because faith is the capacity that God has given us to respond to Him, to choose for Him. This is easy to do (for us, since Christ paid for it). Yet many refuse to do so. Why? Because faith is a response of obedience and trust, using our image of God to respond to God Himself, putting our hope and trust in Him to deliver us seeing as how we can't deliver ourselves from death.</p>

<p>Arguing about the mechanics where the Bible doesn't delineate them is not profitable. What we can say for sure is that some are saved and some are not. What is the distinction? Believers believe, unbelievers do not believe (Jn.3:18). That means that believers have responded to God, to His truth, to His Spirit; believers have accepted things that cannot be proven empirically by trusting in God instead (Heb.11:1). And believers are saved as a result. How do we know we are saved? We know from the Spirit whom God has placed in us when we became one with His Son Jesus Christ.</p>



</div>
---
<div class="special-content quote">






<div class="special-content scripture">
<strong>Romans 8:15-16 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p><strong>15</strong> For you have not received a spirit of slavery [leading you] back to [a state of] fear [of damnation], but you have the Spirit who has entered you into God's family, in whom we cry, "Abba! My Father!" <strong>16</strong> For the Spirit Himself testifies to our spirit that we are God's children.</p>

</div>


<div class="special-content scripture">
<strong>Galatians 4:6 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p>And since you are sons, God sent the Spirit of His Son into your hearts, crying, "Abba, Father!"</p>

</div>




</div>
---
<div class="special-content quote">






<p>If we are saved – and we are, as the Spirit tells us – then what is the point of trying to peel the onion back to discover just how much we knew when we were first saved? Not only is this pointless in my opinion but it is also impossible (since we really don't know with complete specificity what we thought or believed yesterday, not with certainty, and certainly not many years ago) . . . and also dangerous: because such exercises of looking backwards of necessity hinder our forward progress. And the Christian life is all about moving forward, concentrating on making spiritual progress TODAY; not fretting about what mistakes we might have made yesterday.</p>

<div class="special-content scripture">
<strong>Philippians 3:12-16 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p><strong>12</strong> [It is] not that I have already gotten [what I am striving for], nor that I have already completed [my course]. Rather, I am continuing to pursue [the prize] in hopes of fully acquiring it – [this prize for whose acquisition] I was myself acquired by Christ Jesus. <strong>13</strong> Brethren, I do not consider that I have already acquired it. This one thing only [do I keep in mind]. Forgetting what lies behind me [on the course] and straining towards the [course] ahead, <strong>14</strong> I continue to drive straight for the tape, towards the prize to which God has called us from the beginning [of our race] in Christ Jesus. <strong>15</strong> So as many as are [spiritually] mature, let us have this attitude (i.e., of focusing on our spiritual advance and reward and not getting hung up on what lies behind: vv.13-14), and if in any matter your attitude is off-center, God will reveal that to you (i.e., assuming you are mature and are advancing as you should). <strong>16</strong> But with respect to the progress you have made, keep on advancing in the same way!</p>

</div>




</div>
---
<div class="special-content quote">






<p>I studied theology formally in seminary and also engaged in a survey of formal theology in preparation for writing <a href="https://www.ichthys.com/Bible-Basics-Home-Page.htm">the Basics series</a>. I can tell you that there is very little profit in that either. The problem with traditional theology is the same as the problem with developing logical constructs and then attempting to apply them to the Bible. The Bible contains its own system of truth. Theology and logic (often working hand in hand) prescribe systematic categories, many of which do not even occur in actual scripture, and them attempt to jam the Bible into them. A theologian or logician comes up with a concept or a category and then interprets the Bible accordingly. How many angels can dance of the head of a pin? Approaching that as a theological problem, I can see scriptures which might be applied. Approaching it as a logical problem, I can think of arguments which might be deployed. But the fallacy of the approach is to be seen in the truth that this is the wrong question to be asking in the first place. Not only does the Bible not ask it or imply that it needs to be asked, but no serious Christian who wants to live for Jesus Christ would ever think to ask it. This example may be obvious, but it turns out that much of what traditional theology asks is similarly wrong-headed – because its questions come from the logical development of theological systems which are in fact extra-biblically derived. Do you want to know what a "dispensation" is? Then look to see what the Bible actually has to say about the issue; don't develop a theory / system and seek to plug into it all manner of things where it does not actually fit.</p>

<p>The above is a long way of saying that I think you would have been a lot better off just reading Ichthys, putting the "bones" aside when you bumped into them (asking me about them if you had questions), but seeking to grow positively through the truth by embracing spiritual growth on every front, not tackling individual questions and issues from the past exclusively, logically, theologically.</p>



</div>
---
<div class="special-content quote">






<p>Your Q1: Re: what is actually minimally required for salvation?</p>

<p>A1: Believing in God's provision for salvation, our Savior Jesus Christ, is all that is required to be saved.</p>

<div class="special-content scripture">
<strong>Acts 16:31 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p>"Believe in the Lord Jesus, and you will be saved."</p>
</div>




</div>
---
<div class="special-content quote">






<p>Your Q2 - Re: not knowing about everything about the deity and humanity of Christ at salvation.</p>

<p>A2: The Spirit gave you sufficient knowledge to be saved and you were saved – and that is all that matters.</p>

<div class="special-content scripture">
<strong>2nd Timothy 2:19a | NKJV</strong>

<p>Nevertheless, God's solid foundation stands firm, sealed with this inscription: “The Lord knows those who are his"</p>

</div>




</div>
---
<div class="special-content quote">






<p>Your Q3a - Re: recognizing Christ's deity later on reading scripture.</p>

<p>A3a: This is the way it works for all believers; that is to say, we start with a little but then we are given more – at least for all those who are willing to grow. And for all who are willing to grow, there will be tests; the fact of tests does not in any way undermine the veracity of the truth. But the devil is always trying to detach believers from the truth. And he knows our weaknesses – like a penchant for needing things neat and tidy and logical – and he is very good at using others, misguided believers or Christians in name only, to attack our faith in the truth.</p>

<div class="special-content scripture">
<strong>2nd Corinthians 2:11 | NKJV</strong>

<p>...in order that Satan might not outwit us. For we are not unaware of his schemes.</p>

</div>




</div>
---
<div class="special-content quote">






<p>Your Q3b - Re: 'problem' of not knowing of Christ's eternity at salvation.</p>

<p>A3b: I don't think we have a problem at all. God is God. If we have questions – about anything in scripture – there may be answers in the Bible or these may be available through ministries that teach (like Ichthys). But our questions do not overrule the truth nor can they be allowed to wrongly categorize the truth; false categorization is the original sin of all traditional theology. Believers who are not pastor-teachers by gifting (and also those who are but who are not prepared sufficiently to do their own research) need to read their Bibles, yes, but then also attend to a good teaching ministry, and wait patiently for answers rather than allowing questions to undermine their faith. Eventually, all our questions are answered – all the legitimate ones, that is, while the others fall by the wayside . . . IF we are advancing spiritually as we should be doing.</p>



</div>
---
<div class="special-content quote">






<div class="special-content scripture">
<strong>John 1:1-3 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p><strong>1</strong> The Word [Jesus Christ] existed at the very beginning, and there was reciprocity between the Word and God [the Father]. <strong>2</strong> This One both existed and enjoyed reciprocity with God from the very beginning. <strong>3</strong> Everything came into being through Him, and without Him, nothing has come into being which has in fact come into being.</p>

</div>


<div class="special-content scripture">
<strong>Colossians 1:15-17 | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p><strong>15</strong> He (i.e., Jesus Christ; cf. v.13) is the exact image of the invisible God, the firstborn of all creation. <strong>16</strong> Everything in the heavens and on the earth was created by Him, things invisible as well as those visible – whether thrones, authorities, rulers or powers, everything was created through Him and for Him. <strong>17</strong> And He Himself is before everything, and everything subsists in Him (cf. Heb.1:3).</p>

</div>


<div class="special-content scripture">
<strong>Hebrews 1:3a | <a href="/site/content-features/#ichthys-translations">Ichthys translation</a></strong>

<p>[Jesus Christ] is the shining forth of [the Father's] glory, the precise image of His essence, the One who [in His deity] sustains the universe by His mighty Word.</p>

</div>




</div>
---
<div class="special-content quote">






<p>Your Q4a - Re: having more knowledge now but still wrestling with the truth.</p>

<p>A4a: As a believer, you are not required to parse every verse in the Bible. That is the job of a pastor-teacher. If you feel you have this gift, wrestling with scripture and with principles you've been taught is part of the process, but deconstructing one's faith-system is a dangerous business if it goes too far and too soon, even for those so gifted who are embarked on a serious course of preparation. I really feel it would be good to read the Basics series (<a href="https://www.ichthys.com/Bible-Basics-Home-Page.htm">link</a>) and to try and accept the truth of what's in there, putting aside the bones until things start to fall into place – which I am confident they will if you have a little faith. <em>dio kai</em> in the Greek doesn't support the weight of meaning you are placing on it in Luke 1:35. This verse says that Jesus in His humanity <strong><em>will</em></strong> be called the Son of God; it doesn't say that He is <strong><em>not</em></strong> / was <strong><em>not</em></strong> the Son of God from all eternity – which indeed He was. There is no direct contradiction here. Jesus came into the world; He couldn't come into the world if He didn't exist as God before He came into the world.</p>

<div class="special-content scripture">
<strong>John 6:38 | NKJV</strong>

<p>“For I have come down from heaven, not to do My own will, but the will of Him who sent Me."</p>
</div>




</div>
---
<div class="special-content quote">






<p>Your Q4b - Re: others considering such wrestling as heresy.</p>

<p>A4b: Considered heresy by whom? The church-visible over the centuries and much more so today has been and now is largely composed of unbelievers. To the extent that those in the church-visible actually are believers, the vast majority of them are lukewarm, immature, and only marginal at best. If individuals in, e.g., the RC church were believers, why would they stay in that group? If individuals in, e.g., traditional, Calvinist, Baptist, charismatic, mega-churches, e.g., were interested in growing spiritually, why would they stay in those groups? Believe the Bible. Believe the Spirit. Believe the truth. Find a good ministry that is teaching the truth and stick with it – that is the way to grow.</p>



</div>
---
<div class="special-content quote">






<ol>
<li>You are saved since you believe in Jesus Christ. If you want to know more about the mechanics, please read <a href="https://www.ichthys.com/4B-Soterio.htm">BB 4B</a> (at the link).</li>
<li>Re: worrying about all this: Don't worry in the first place (e.g., Matt.6:25-34)! The Christian life is about joy and peace – spiritual growth, progress and progression. It is about looking forward, not looking backward. Determine to move on. We all have "tics" which, if allowed to gain our attention, will do us no good in trying to solve because they are insoluble on their own terms; but all such concerns can always be dealt with, allayed, quieted through growth and application of the truth.</li>
</ol>

<div class="special-content scripture">
<strong>John 14:27 | NKJV  </strong>

<p>“Peace I leave with you, My peace I give to you; not as the world gives do I give to you. Let not your heart be troubled, neither let it be afraid."</p>

</div>




</div>
---
<div class="special-content quote">






<p>To reiterate, serious spiritual growth never happens through tackling "problems of concern" through fixating on them and applying logic and traditional theology. Spiritual growth requires embracing <strong><em>all</em></strong> of God's truth in scripture through a broad-based approach by attending to a good, Bible teaching ministry, hearing, learning, believing and applying the truth. Ichthys is at your service, my friend.</p>

<p>I do keep you in my prayers daily.</p>

<p>In Jesus,</p>

<p>Bob L.</p>

</div>
